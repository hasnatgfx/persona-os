<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Persona OS — Client Persona Research</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FAFAF8; --surface:#FFFFFF; --surface-2:#F3F3F1;
    --ink:#1B1C1F; --ink-muted:#6B6E76; --ink-faint:#9A9CA3;
    --border:#E6E5E1; --border-strong:#D3D2CC;
    --accent:#2F5DFF; --accent-ink:#FFFFFF; --accent-soft:#EAEFFF;
    --success:#1C8A5D; --success-soft:#E6F4ED;
    --warn:#B7791F; --warn-soft:#FBF0DD;
    --danger:#C0392B; --danger-soft:#FBEAE7;
    --radius:10px; --radius-lg:16px;
    --shadow:0 1px 2px rgba(20,20,20,.04), 0 8px 24px rgba(20,20,20,.05);
  }
  [data-theme="dark"]{
    --bg:#16171A; --surface:#1D1F23; --surface-2:#25272C;
    --ink:#ECECEE; --ink-muted:#A2A4AC; --ink-faint:#6C6E76;
    --border:#33353B; --border-strong:#43454C;
    --accent:#5B82FF; --accent-ink:#0F1220; --accent-soft:#1E2740;
    --success:#4CBA88; --success-soft:#173327;
    --warn:#E0AC52; --warn-soft:#332A15;
    --danger:#E17B6D; --danger-soft:#331E1B;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:'Inter',sans-serif; font-size:14px; line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.serif{font-family:'Fraunces',serif;}
  button{font-family:inherit;}
  a{color:inherit;}
  ::selection{background:var(--accent-soft);}
  *:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}

  #app{display:flex; min-height:100vh;}

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:248px; flex-shrink:0; background:var(--surface);
    border-right:1px solid var(--border); padding:24px 16px;
    display:flex; flex-direction:column; position:sticky; top:0; height:100vh;
  }
  .brand{display:flex; align-items:baseline; gap:8px; padding:0 8px 22px 8px;}
  .brand-mark{width:9px;height:9px;border-radius:2px;background:var(--accent); transform:rotate(45deg); flex-shrink:0;}
  .brand-name{font-family:'Fraunces',serif; font-weight:600; font-size:17px; letter-spacing:-0.01em;}
  .nav{display:flex; flex-direction:column; gap:2px; margin-top:4px;}
  .nav-item{
    display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:8px;
    color:var(--ink-muted); font-size:13.5px; font-weight:500; cursor:pointer; border:none; background:none;
    text-align:left; width:100%;
  }
  .nav-item:hover{background:var(--surface-2); color:var(--ink);}
  .nav-item.active{background:var(--accent-soft); color:var(--accent);}
  .nav-icon{width:16px; text-align:center; font-size:14px; opacity:.85;}
  .sidebar-spacer{flex:1;}
  .sidebar-foot{border-top:1px solid var(--border); padding-top:14px; margin-top:10px;}
  .sidebar-progress-label{font-size:11.5px; color:var(--ink-faint); margin-bottom:6px;}
  .sidebar-progress-bar{height:5px; background:var(--surface-2); border-radius:4px; overflow:hidden; margin-bottom:5px;}
  .sidebar-progress-fill{height:100%; background:var(--accent); border-radius:4px; transition:width .4s ease;}
  .sidebar-progress-pct{font-size:12.5px; font-weight:600;}
  .sidebar-project{font-size:11.5px; color:var(--ink-faint); margin-top:12px; line-height:1.4;}
  .sidebar-project b{color:var(--ink-muted); font-weight:600; display:block; font-size:11px; margin-bottom:2px;}

  /* ---------- Main ---------- */
  main{flex:1; min-width:0; padding:32px 40px 80px 40px; max-width:1080px;}
  .topbar{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:28px; gap:16px;}
  .view-title{font-size:23px; font-weight:600; letter-spacing:-0.01em;}
  .view-sub{color:var(--ink-muted); font-size:13.5px; margin-top:4px;}
  .theme-toggle{
    border:1px solid var(--border-strong); background:var(--surface); color:var(--ink-muted);
    border-radius:20px; padding:6px 12px; font-size:12.5px; cursor:pointer; display:flex; align-items:center; gap:6px;
  }
  .theme-toggle:hover{color:var(--ink); border-color:var(--ink-faint);}

  /* ---------- Buttons / inputs ---------- */
  .btn{
    display:inline-flex; align-items:center; gap:6px; border-radius:8px; padding:8px 14px;
    font-size:13px; font-weight:600; cursor:pointer; border:1px solid transparent; white-space:nowrap;
  }
  .btn-primary{background:var(--accent); color:var(--accent-ink);}
  .btn-primary:hover{filter:brightness(1.07);}
  .btn-secondary{background:var(--surface); color:var(--ink); border-color:var(--border-strong);}
  .btn-secondary:hover{background:var(--surface-2);}
  .btn-ghost{background:none; color:var(--ink-muted); border:none; padding:6px 8px;}
  .btn-ghost:hover{color:var(--ink);}
  .btn-danger{background:var(--danger-soft); color:var(--danger);}
  .btn-sm{padding:5px 10px; font-size:12px; border-radius:7px;}
  input[type=text],input[type=date],input[type=url],select,textarea{
    width:100%; background:var(--surface); border:1px solid var(--border-strong); color:var(--ink);
    border-radius:8px; padding:9px 11px; font-size:13.5px; font-family:inherit;
  }
  textarea{resize:vertical; min-height:70px; line-height:1.5;}
  label.field-label{display:block; font-size:12px; font-weight:600; color:var(--ink-muted); margin-bottom:5px;}
  .field{margin-bottom:14px;}
  .field-row{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  .field-row3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px;}

  /* ---------- Sections / panels ---------- */
  .panel{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:22px 24px; margin-bottom:20px;}
  .panel-title{font-size:15.5px; font-weight:600; margin-bottom:2px;}
  .panel-sub{font-size:12.5px; color:var(--ink-muted); margin-bottom:16px;}
  .hr{height:1px; background:var(--border); margin:18px 0;}

  /* ---------- Dashboard hero ---------- */
  .hero{margin-bottom:26px;}
  .hero-greeting{font-size:22px; font-weight:500; margin-bottom:4px;}
  .hero-sub{color:var(--ink-muted); font-size:14px;}
  .stat-row{display:grid; grid-template-columns:1.2fr 1fr; gap:16px; margin-bottom:20px;}
  .stat-big{font-family:'Fraunces',serif; font-size:44px; font-weight:600; line-height:1;}
  .progress-track{height:8px; background:var(--surface-2); border-radius:5px; overflow:hidden; margin:14px 0 8px 0;}
  .progress-fill{height:100%; background:var(--accent); border-radius:5px; transition:width .5s ease;}
  .progress-caption{font-size:12.5px; color:var(--ink-muted);}

  /* stepper */
  .stepper{display:flex; align-items:center; margin:6px 0 4px 0;}
  .step{display:flex; flex-direction:column; align-items:center; flex:1; position:relative;}
  .step-dot{width:11px; height:11px; border-radius:50%; background:var(--border-strong); border:2px solid var(--surface); box-shadow:0 0 0 1px var(--border-strong); z-index:1;}
  .step.done .step-dot{background:var(--accent); box-shadow:0 0 0 1px var(--accent);}
  .step.current .step-dot{background:var(--accent-ink); box-shadow:0 0 0 3px var(--accent-soft), 0 0 0 1px var(--accent);}
  .step-line{position:absolute; top:5px; left:50%; width:100%; height:2px; background:var(--border-strong); z-index:0;}
  .step.done .step-line{background:var(--accent);}
  .step:first-child .step-line{display:none;}
  .step-label{font-size:11.5px; margin-top:8px; color:var(--ink-muted); font-weight:600; text-align:center;}
  .step.current .step-label{color:var(--ink);}

  /* next action */
  .next-action{display:flex; justify-content:space-between; align-items:center; gap:16px; background:var(--accent-soft); border-radius:var(--radius-lg); padding:18px 22px;}
  .next-action-label{font-size:11.5px; font-weight:700; color:var(--accent); letter-spacing:.02em; margin-bottom:4px;}
  .next-action-title{font-size:16px; font-weight:600; margin-bottom:4px;}
  .next-action-why{font-size:12.5px; color:var(--ink-muted); max-width:480px;}

  /* phase cards */
  .phase-card{border:1px solid var(--border); border-radius:var(--radius-lg); margin-bottom:14px; overflow:hidden; background:var(--surface);}
  .phase-head{display:flex; align-items:center; justify-content:space-between; padding:16px 20px; cursor:pointer;}
  .phase-head-left{display:flex; align-items:center; gap:14px;}
  .phase-num{font-family:'Fraunces',serif; font-size:13px; color:var(--ink-faint); font-weight:600; width:22px;}
  .phase-name{font-weight:600; font-size:14.5px;}
  .phase-desc{font-size:12px; color:var(--ink-muted); margin-top:2px;}
  .phase-meta{display:flex; align-items:center; gap:14px;}
  .phase-pct{font-size:12.5px; font-weight:600; color:var(--ink-muted); width:36px; text-align:right;}
  .phase-mini-track{width:70px; height:5px; background:var(--surface-2); border-radius:4px; overflow:hidden;}
  .phase-mini-fill{height:100%; background:var(--accent); border-radius:4px;}
  .phase-complete-badge{background:var(--success-soft); color:var(--success); font-size:11px; font-weight:700; padding:3px 9px; border-radius:20px;}
  .chevron{color:var(--ink-faint); transition:transform .2s ease; font-size:11px;}
  .phase-card.open .chevron{transform:rotate(90deg);}
  .phase-body{padding:0 20px 20px 20px; display:none; border-top:1px solid var(--border);}
  .phase-card.open .phase-body{display:block; padding-top:16px;}

  .checklist-group-title{font-size:11.5px; font-weight:700; color:var(--ink-faint); margin:14px 0 6px 0;}
  .checklist-group-title:first-child{margin-top:0;}
  .check-row{display:flex; align-items:flex-start; gap:10px; padding:7px 8px; border-radius:8px; cursor:pointer;}
  .check-row:hover{background:var(--surface-2);}
  .check-box{width:16px; height:16px; border:1.5px solid var(--border-strong); border-radius:5px; flex-shrink:0; margin-top:1px; display:flex; align-items:center; justify-content:center; font-size:10px; color:transparent;}
  .check-row.checked .check-box{background:var(--success); border-color:var(--success); color:#fff;}
  .check-row.checked .check-label{text-decoration:line-through; color:var(--ink-faint);}
  .check-label{font-size:13.5px;}

  /* badges */
  .badge{display:inline-flex; align-items:center; font-size:11px; font-weight:700; padding:3px 9px; border-radius:20px;}
  .badge-neutral{background:var(--surface-2); color:var(--ink-muted);}
  .badge-progress{background:var(--accent-soft); color:var(--accent);}
  .badge-success{background:var(--success-soft); color:var(--success);}
  .badge-warn{background:var(--warn-soft); color:var(--warn);}
  .badge-danger{background:var(--danger-soft); color:var(--danger);}
  .demo-tag{background:var(--warn-soft); color:var(--warn); font-size:10px; font-weight:700; padding:2px 7px; border-radius:5px; margin-left:8px;}

  /* table */
  .table-toolbar{display:flex; gap:10px; margin-bottom:14px; flex-wrap:wrap; align-items:center;}
  .table-toolbar input, .table-toolbar select{width:auto; min-width:120px;}
  .table-toolbar input[type=text]{flex:1; min-width:180px;}
  table{width:100%; border-collapse:collapse; font-size:13.5px;}
  th{text-align:left; font-size:11px; color:var(--ink-faint); font-weight:700; padding:8px 10px; border-bottom:1px solid var(--border);}
  td{padding:11px 10px; border-bottom:1px solid var(--border); vertical-align:middle;}
  tr.person-row{cursor:pointer;}
  tr.person-row:hover{background:var(--surface-2);}
  .fit-score{font-weight:700;}
  .stars{color:var(--warn); letter-spacing:1px;}
  .cards-mobile{display:none;}

  /* modal */
  .modal-overlay{position:fixed; inset:0; background:rgba(15,15,17,.45); display:flex; align-items:flex-start; justify-content:center; padding:40px 20px; z-index:50; overflow-y:auto;}
  .modal{background:var(--surface); border-radius:var(--radius-lg); max-width:620px; width:100%; padding:26px 28px; box-shadow:var(--shadow); margin-bottom:40px;}
  .modal-title{font-size:17px; font-weight:600; margin-bottom:2px;}
  .modal-sub{font-size:12.5px; color:var(--ink-muted); margin-bottom:18px;}
  .modal-actions{display:flex; justify-content:flex-end; gap:10px; margin-top:6px;}

  /* toast */
  .toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--ink); color:var(--bg); padding:10px 18px; border-radius:8px; font-size:13px; font-weight:500; opacity:0; transition:all .25s ease; z-index:100; pointer-events:none;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  /* persona summary card */
  .persona-summary{border:1px solid var(--border); border-radius:var(--radius-lg); padding:26px 28px; background:linear-gradient(180deg, var(--surface) 0%, var(--surface) 100%);}
  .persona-summary h2{font-size:22px; margin:0 0 16px 0;}
  .persona-grid{display:grid; grid-template-columns:1fr 1fr; gap:18px 28px;}
  .persona-field-label{font-size:11px; font-weight:700; color:var(--ink-faint); margin-bottom:3px;}
  .persona-field-value{font-size:13.5px;}

  .empty-state{text-align:center; padding:50px 20px; color:var(--ink-muted);}
  .empty-state h3{color:var(--ink); font-size:16px; margin-bottom:6px;}
  .empty-state p{font-size:13px; max-width:360px; margin:0 auto 16px auto;}

  .evidence-pill{display:inline-flex; align-items:center; gap:6px; font-size:12px; background:var(--surface-2); padding:4px 10px; border-radius:20px; color:var(--ink-muted);}

  .list-entry{border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px; margin-bottom:10px;}
  .list-entry-head{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:6px;}
  .list-entry-title{font-weight:600; font-size:13.5px;}
  .list-entry-meta{font-size:11.5px; color:var(--ink-faint);}
  .list-entry-body{font-size:13px; color:var(--ink-muted); white-space:pre-wrap;}

  ::placeholder{color:var(--ink-faint);}

  @media (max-width: 880px){
    #app{flex-direction:column;}
    .sidebar{position:relative; width:100%; height:auto; flex-direction:row; align-items:center; padding:14px 16px; overflow-x:auto;}
    .sidebar-spacer{display:none;}
    .sidebar-foot{display:none;}
    .nav{flex-direction:row; margin-top:0;}
    main{padding:20px;}
    .field-row,.field-row3,.persona-grid,.stat-row{grid-template-columns:1fr;}
    table{display:none;}
    .cards-mobile{display:block;}
  }
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
/* ============================= STORAGE ============================= */
const STORAGE_KEY = 'persona-os-state-v1';
async function loadState(){
  try{
    const res = await window.storage.get(STORAGE_KEY);
    if(res && res.value) return JSON.parse(res.value);
  }catch(e){ /* no saved state yet */ }
  return null;
}
let saveTimer = null;
function persist(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    try{ await window.storage.set(STORAGE_KEY, JSON.stringify(state)); }
    catch(e){ console.error('Storage error', e); showToast('Could not save — your changes are only in this session'); }
  }, 250);
}

/* ============================= DEFAULT / DEMO STATE ============================= */
function uid(){ return Math.random().toString(36).slice(2,10); }

      ],

          businessModel:'Retainer + project', marketPosition:'Established but low visibility',

          painSignals:'Strong technical reputation but LinkedIn presence looks dated — reused slide screenshots, no consistent visual system.',

          notes:'Warm — worth a direct outreach.', fitScore:82, status:'Researched'
        },
        {
          id:uid(), demo:true, name:'Sarah Khan', company:'Khan Cyber Advisory', website:'', linkedin:'',

          sells:'Fractional CISO services', audience:'Series B–D startups',

        who:'', sells:'', serves:'', want:'',

        whyHire:'', whyNotHire:'', whereTime:'', howFind:''
      }
    },
    phase5:{
      checklist:[
        {id:'p5-1', label:'Create persona-specific messaging', checked:false},

      ]
    },
    experiments:[
      {id:uid(), demo:true, name:'Experiment #01', hypothesis:'Cybersecurity consultants will respond positively to a design service positioned around LinkedIn authority rather than generic graphic design.', audience:'Cybersecurity consultants', channel:'LinkedIn', duration:'30 days', expected:'10 meaningful conversations', actual:'7 conversations', outcome:'Promising', status:'Completed'}
    ],
    weeklyReviews:[],
    monthlyReviews:[],
    openPhase:'phase2'
  };
}

let state = null;

/* ============================= COMPUTATION ============================= */
function phaseTasks(p){
  if(p==='phase1') return state.phase1.checklist;
  if(p==='phase2') return state.phase2.checklist;
  if(p==='phase3') return state.phase3.checklist;
  if(p==='phase5') return state.phase5.checklist;
  return [];
}
function phase4Fields(){
  const per = state.phase4.persona;
  const keys = ['who','sells','serves','want','surfaceProblem','operationalProblem','businessProblem','emotionalPain','outcome','triggers','objections','criteria','values','fears','whyHire','whyNotHire','whereTime','howFind'];
  return keys;
}
function phasePct(p){
  if(p==='phase4'){
    const keys = phase4Fields();
    const filled = keys.filter(k=>state.phase4.persona[k] && state.phase4.persona[k].trim()).length;
    return Math.round((filled/keys.length)*100);
  }
  const tasks = phaseTasks(p);
  if(!tasks.length) return 0;
  return Math.round((tasks.filter(t=>t.checked).length/tasks.length)*100);
}
function overallPct(){
  const parts = ['phase1','phase2','phase3','phase4','phase5'].map(phasePct);
  return Math.round(parts.reduce((a,b)=>a+b,0)/parts.length);
}
function overallCounts(){
  let done=0, total=0;
  ['phase1','phase2','phase3','phase5'].forEach(p=>{
    phaseTasks(p).forEach(t=>{ total++; if(t.checked) done++; });
  });
  const keys = phase4Fields();
  total += keys.length;
  done += keys.filter(k=>state.phase4.persona[k] && state.phase4.persona[k].trim()).length;
  return {done,total};
}
const PHASE_META = {
  phase1:{num:'01', name:'Define ICP', label:'Define', desc:'Define who you believe your ideal client is'},
  phase2:{num:'02', name:'Research real people', label:'Research', desc:'Study real people before building the persona'},
  phase3:{num:'03', name:'Find patterns', label:'Analyze', desc:'Compare research to identify repeated signals'},
  phase4:{num:'04', name:'Build client persona', label:'Build', desc:'Turn evidence into a working persona'},
  phase5:{num:'05', name:'Validate & test', label:'Test', desc:'Run the persona through a real experiment'},
};
function nextAction(){
  for(const p of ['phase1','phase2','phase3','phase4','phase5']){
    if(phasePct(p) < 100){
      const meta = PHASE_META[p];
      if(p==='phase2' && state.phase2.people.length < 3){
        return {phase:p, title:'Add another person to research', why:`You've researched ${state.phase2.people.length} people so far. Keep collecting real-world evidence before building the persona.`};
      }
      const tasks = phaseTasks(p);
      const nextTask = tasks.find(t=>!t.checked);
      if(nextTask){
        return {phase:p, title:nextTask.label, why:`You're in ${meta.name}. ${tasks.filter(t=>t.checked).length} of ${tasks.length} tasks done — keep going.`};
      }
      if(p==='phase4'){
        return {phase:p, title:'Fill in the remaining persona fields', why:'Use what you learned in research and patterns to complete the persona.'};
      }
      return {phase:p, title:`Continue ${meta.name}`, why:meta.desc};
    }
  }
  return {phase:'phase5', title:'Review your validated persona', why:'Every phase is complete. Revisit your monthly review to decide next steps.'};
}
function fitLabel(score){
  if(score>=90) return {t:'Excellent fit', cls:'badge-success'};
  if(score>=75) return {t:'Strong fit', cls:'badge-success'};
  if(score>=60) return {t:'Possible fit', cls:'badge-warn'};
  return {t:'Weak fit', cls:'badge-danger'};
}

/* ============================= HELPERS ============================= */
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._timer);
  showToast._timer = setTimeout(()=>t.classList.remove('show'), 1800);
}
function esc(s){
  return (s===undefined||s===null) ? '' : String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function stars(n){
  n = n||0;
  let out='';
  for(let i=1;i<=5;i++) out += i<=n ? '★' : '☆';
  return out;
}

          </tr>`;
        }).join('')}
      </tbody>
    </table>
    <div class="cards-mobile">

        const fit = fitLabel(p.fitScore||0);
        return `<div class="list-entry" data-open-person="${p.id}">

          </div>

        </div>`;
      }).join('')}
    </div>
  `;
}

function computeFitScore(p){
  let score = 40;
  const activityMap = {'Very Low':0,'Low':3,'Medium':7,'High':11,'Very High':14};
  score += activityMap[p.linkedinActivity]||0;
  score += (5-(p.visualQuality||0))*4; // low visual quality = higher design opportunity
  score += (p.contentQuality||0)*2;
  if(p.painSignals && p.painSignals.trim()) score += 8;
  if(p.buyingSignals && p.buyingSignals.trim()) score += 10;
  if(p.opportunity && p.opportunity.trim()) score += 6;
  return Math.max(0, Math.min(100, Math.round(score)));
}

function openPersonModal(existing){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'modal-overlay';
  const isEdit = !!existing;
  overlay.innerHTML = `
    <div class="modal">
      <div class="modal-title">${isEdit?'Edit person':'Add a potential client'}</div>
      <div class="modal-sub">Capture what you observe — this becomes the evidence behind your persona.</div>
      ${personFormHtml(existing)}
      <div class="modal-actions">
        ${isEdit?`<button class="btn btn-danger btn-sm" id="pf-delete" style="margin-right:auto;">Delete</button>`:''}
        <button class="btn btn-secondary" id="pf-cancel">Cancel</button>
        <button class="btn btn-primary" id="pf-save">${isEdit?'Save changes':'Add person'}</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', e=>{ if(e.target===overlay) overlay.remove(); });
  document.getElementById('pf-cancel').onclick = ()=>overlay.remove();
  if(isEdit){
    document.getElementById('pf-delete').onclick = ()=>{
      state.phase2.people = state.phase2.people.filter(p=>p.id!==existing.id);
      overlay.remove(); persist(); render(); showToast('Person deleted');
    };
  }
  document.getElementById('pf-save').onclick = ()=>{
    const data = readPersonForm();
    if(!data.name.trim()){ showToast('Give this person a name first'); return; }
    data.fitScore = computeFitScore(data);
    data.status = isEdit ? (existing.status||'Researched') : 'Researched';
    if(isEdit){
      Object.assign(existing, data);
    } else {
      data.id = uid(); data.demo = false;
      state.phase2.people.push(data);
    }
    state.project.updated = new Date().toISOString().slice(0,10);
    overlay.remove(); persist(); render();
    showToast(isEdit?'Person updated':'Person added');
  };
}

/* ============================= EVENT WIRING ============================= */
function wireGlobal(){
  document.querySelectorAll('[data-nav]').forEach(el=>{
    el.onclick = ()=>{ state.currentView = el.getAttribute('data-nav'); persist(); render(); };
  });
  const themeBtns = document.querySelectorAll('[data-action="toggle-theme"]');
  themeBtns.forEach(b=> b.onclick = ()=>{ state.theme = state.theme==='light'?'dark':'light'; persist(); render(); });
}

function wireView(){
  // phase toggles
  document.querySelectorAll('[data-toggle-phase]').forEach(el=>{
    el.onclick = ()=>{
      const p = el.getAttribute('data-toggle-phase');
      state.openPhase = state.openPhase===p ? null : p;
      persist(); render();
    };
  });
  // task toggles
  document.querySelectorAll('[data-toggle-task]').forEach(el=>{
    el.onclick = ()=>{
      const [phase, id] = el.getAttribute('data-toggle-task').split(':');
      const list = phase==='phase1'?state.phase1.checklist:phase==='phase2'?state.phase2.checklist:phase==='phase3'?state.phase3.checklist:state.phase5.checklist;
      const task = list.find(t=>t.id===id);
      if(task){ task.checked = !task.checked; state.project.updated = new Date().toISOString().slice(0,10); }
      persist(); render();
    };
  });

  // research view
  const searchEl = document.getElementById('research-search');
  if(searchEl){
    const refreshTable = ()=>{
      state.researchFilters = {
        q: document.getElementById('research-search').value,
        industry: document.getElementById('filter-industry').value,
        activity: document.getElementById('filter-activity').value,
      };
      const f = state.researchFilters;
      const filtered = state.phase2.people.filter(p=>{
        if(f.q && !(`${p.name} ${p.company} ${p.role}`.toLowerCase().includes(f.q.toLowerCase()))) return false;
        if(f.industry && p.industry !== f.industry) return false;
        if(f.activity && p.linkedinActivity !== f.activity) return false;
        return true;
      });
      document.getElementById('people-table-wrap').innerHTML = renderPeopleTable(filtered);
      wirePeopleRows();
      persist();
    };
    searchEl.addEventListener('input', refreshTable);
    document.getElementById('filter-industry').addEventListener('change', refreshTable);
    document.getElementById('filter-activity').addEventListener('change', refreshTable);
  }
  wirePeopleRows();

  const addPersonBtns = document.querySelectorAll('[data-action="open-add-person"]');
  addPersonBtns.forEach(b=> b.onclick = ()=>openPersonModal(null));

  const saveHyp = document.getElementById('save-hypothesis') || document.querySelector('[data-action="save-hypothesis"]');
  if(saveHyp) saveHyp.onclick = ()=>{
    state.phase1.hypothesis = document.getElementById('icp-hypothesis').value;
    persist(); showToast('ICP hypothesis saved');
  };

  const newProjectBtn = document.querySelector('[data-action="new-project"]');
  if(newProjectBtn) newProjectBtn.onclick = openNewProjectModal;
  const dupBtn = document.querySelector('[data-action="duplicate-project"]');
  if(dupBtn) dupBtn.onclick = ()=>{
    state.project.name = state.project.name + ' (copy)';
    persist(); render(); showToast('Project duplicated');
  };

  // patterns
  const addPatternBtn = document.querySelector('[data-action="open-add-pattern"]');
  if(addPatternBtn) addPatternBtn.onclick = openPatternModal;
  document.querySelectorAll('[data-delete-pattern]').forEach(el=>{
    el.onclick = ()=>{
      state.phase3.patterns = state.phase3.patterns.filter(p=>p.id!==el.getAttribute('data-delete-pattern'));
      persist(); render();
    };
  });

  // persona
  const savePersonaBtn = document.querySelector('[data-action="save-persona"]');
  if(savePersonaBtn) savePersonaBtn.onclick = ()=>{
    state.phase4.persona.name = document.getElementById('persona-name').value;
    PERSONA_FIELDS.forEach(([key])=>{
      state.phase4.persona[key] = document.getElementById('persona-'+key).value;
    });
    persist(); render(); showToast('Persona saved');
  };

  // experiments
  const addExpBtn = document.querySelector('[data-action="open-add-experiment"]');
  if(addExpBtn) addExpBtn.onclick = openExperimentModal;
  document.querySelectorAll('[data-delete-experiment]').forEach(el=>{
    el.onclick = ()=>{
      state.experiments = state.experiments.filter(e=>e.id!==el.getAttribute('data-delete-experiment'));
      persist(); render();
    };
  });

  // reviews
  const saveWeekly = document.querySelector('[data-action="save-weekly"]');
  if(saveWeekly) saveWeekly.onclick = ()=>{
    const val = id=>document.getElementById(id).value;
    state.weeklyReviews.push({
      date:new Date().toISOString().slice(0,10),
      learn:val('wr-learn'), patterns:val('wr-patterns'), surprise:val('wr-surprise'),
      wrong:val('wr-wrong'), testnext:val('wr-testnext'), stop:val('wr-stop'), doubledown:val('wr-doubledown')
    });
    persist(); render(); showToast('Weekly review saved');
  };
  const saveMonthly = document.querySelector('[data-action="save-monthly"]');
  if(saveMonthly) saveMonthly.onclick = ()=>{
    const val = id=>document.getElementById(id).value;
    state.monthlyReviews.push({
      date:new Date().toISOString().slice(0,10),
      conversations:val('mr-conversations'), positive:val('mr-positive'), calls:val('mr-calls'),
      clients:val('mr-clients'), verdict:val('mr-verdict')
    });
    persist(); render(); showToast('Monthly review saved');
  };

  // settings
  const saveProjectBtn = document.querySelector('[data-action="save-project"]');
  if(saveProjectBtn) saveProjectBtn.onclick = ()=>{
    state.project.name = document.getElementById('set-name').value;
    state.project.status = document.getElementById('set-status').value;
    state.project.icp = document.getElementById('set-icp').value;
    state.project.goal = document.getElementById('set-goal').value;
    state.project.updated = new Date().toISOString().slice(0,10);
    persist(); render(); showToast('Project saved');
  };
  const exportJsonBtn = document.querySelector('[data-action="export-json"]');
  if(exportJsonBtn) exportJsonBtn.onclick = ()=>{
    const blob = new Blob([JSON.stringify(state,null,2)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = (state.project.name||'persona-project').replace(/\s+/g,'-').toLowerCase()+'.json';
    a.click();
    showToast('Project exported');
  };
  const exportCsvBtn = document.querySelector('[data-action="export-csv"]');
  if(exportCsvBtn) exportCsvBtn.onclick = ()=>{
    const cols = ['name','company','role','industry','linkedinActivity','postingFrequency','visualQuality','contentQuality','fitScore','painSignals','buyingSignals','opportunity'];
    const rows = [cols.join(',')].concat(state.phase2.people.map(p=>
      cols.map(c=>`"${String(p[c]??'').replace(/"/g,'""')}"`).join(',')
    ));
    const blob = new Blob([rows.join('\n')], {type:'text/csv'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'research-people.csv';
    a.click();
    showToast('Research exported');
  };
  const importFile = document.getElementById('import-file');
  if(importFile) importFile.onchange = (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      try{
        const imported = JSON.parse(reader.result);
        state = imported;
        persist(); render(); showToast('Project imported');
      }catch(err){ showToast('Could not read that file'); }
    };
    reader.readAsText(file);
  };
  const resetBtn = document.querySelector('[data-action="reset-all"]');
  if(resetBtn) resetBtn.onclick = ()=>{
    if(confirm('This clears all data and restores the sample project. Continue?')){
      state = defaultState();
      persist(); render(); showToast('Data reset');
    }
  };
}

function wirePeopleRows(){
  document.querySelectorAll('[data-open-person]').forEach(el=>{
    el.onclick = ()=>{
      const person = state.phase2.people.find(p=>p.id===el.getAttribute('data-open-person'));
      if(person) openPersonModal(person);
    };
  });
}

function openNewProjectModal(){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal">
      <div class="modal-title">Create new project</div>
      <div class="field"><label class="field-label">Project name</label><input type="text" id="np-name"></div>
      <div class="field"><label class="field-label">ICP / market</label><input type="text" id="np-icp"></div>
      <div class="field"><label class="field-label">Primary goal</label><input type="text" id="np-goal"></div>
      <div class="field-row">
        <div class="field"><label class="field-label">Start date</label><input type="date" id="np-date" value="${new Date().toISOString().slice(0,10)}"></div>
        <div class="field"><label class="field-label">Status</label>
          <select id="np-status">${['Not Started','Researching','Building Persona','Testing','Validated','Archived'].map(s=>`<option>${s}</option>`).join('')}</select>
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn btn-secondary" id="np-cancel">Cancel</button>
        <button class="btn btn-primary" id="np-save">Create project</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', e=>{ if(e.target===overlay) overlay.remove(); });
  document.getElementById('np-cancel').onclick = ()=>overlay.remove();
  document.getElementById('np-save').onclick = ()=>{
    const name = document.getElementById('np-name').value.trim();
    if(!name){ showToast('Give the project a name'); return; }
    const fresh = defaultState();
    fresh.theme = state.theme;
    fresh.project = {
      name, icp:document.getElementById('np-icp').value, goal:document.getElementById('np-goal').value,
      status:document.getElementById('np-status').value, created:document.getElementById('np-date').value,
      updated:document.getElementById('np-date').value
    };
    fresh.phase1.checklist.forEach(t=>t.checked=false);
    fresh.phase1.hypothesis='';
    fresh.phase2.checklist.forEach(t=>t.checked=false);
    fresh.phase2.people=[];
    fresh.phase3.checklist.forEach(t=>t.checked=false);
    fresh.phase3.patterns=[];
    fresh.phase4.persona = {name:'', who:'',sells:'',serves:'',want:'',surfaceProblem:'',operationalProblem:'',businessProblem:'',emotionalPain:'',outcome:'',triggers:'',objections:'',criteria:'',values:'',fears:'',whyHire:'',whyNotHire:'',whereTime:'',howFind:''};
    fresh.phase5.checklist.forEach(t=>t.checked=false);
    fresh.experiments=[]; fresh.weeklyReviews=[]; fresh.monthlyReviews=[];
    fresh.currentView='research';
    state = fresh;
    overlay.remove(); persist(); render(); showToast('New project created');
  };
}

/* ============================= BOOT ============================= */
(async function boot(){
  const saved = await loadState();
  state = saved || defaultState();
  if(!state.researchFilters) state.researchFilters = {q:'',industry:'',activity:''};
  render();
})();
</script>
</body>
</html>
